<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
    <style>
        /* 这里写 CSS 样式，让页面好看一点 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #007acc;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>

    <h1>你好，世界！</h1>
    <p>这是一个简单的基础 HTML 页面。</p>
    
    <button onclick="alert('按钮被点击啦！')">点我试试</button>

    <!-- 这里写 JavaScript 脚本 -->
    <script>
        console.log("页面加载完成！");
    </script>
</body>
</html>
